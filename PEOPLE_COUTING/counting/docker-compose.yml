# Chạy đơn lẻ orchestrator service: docker compose up -d --build
services:
  people-counting:
    build: .
    image: ${IMAGE_NAME_COUNTING:-harbor.tado.vn/long_dev/people_counting:v2.0.0}
    container_name: grpc-main-people-counting
    gpus: all
    ipc: host
    shm_size: '4gb'
    environment:
      BASE_URL_API: ${BASE_URL_API}
      SESSION_KEY: ${SESSION_KEY}
      SERVICE_TYPES: ${SERVICE_TYPES:-people_counting}
      METRIC_TYPE: ${METRIC_TYPE:-people_counting}
      YOLO_PERSON_ADDR: ${YOLO_PERSON_ADDR:-grpc_person_detector:50060}
      GPU_ID: ${GPU_ID:-0}
      FORCE_CPU_DECODE: ${FORCE_CPU_DECODE:-False}
      USE_MOTION_DETECTOR: ${USE_MOTION_DETECTOR:-False}
      SKIP_FRAME: ${SKIP_FRAME:-3}
      CONFIDENT_PERSON: ${CONFIDENT_PERSON:-0.35}
      USE_BYTETRACK: ${USE_BYTETRACK:-True}
      TRACK_HIGH_THRESH: ${TRACK_HIGH_THRESH:-0.50}
      TRACK_LOW_THRESH: ${TRACK_LOW_THRESH:-0.10}
      NEW_TRACK_THRESH: ${NEW_TRACK_THRESH:-0.60}
      TRACK_BUFFER: ${TRACK_BUFFER:-75}
      MATCH_THRESH: ${MATCH_THRESH:-0.80}
      LINE_BUFFER_PIXELS: ${LINE_BUFFER_PIXELS:-35.0}
      STATIONARY_DISPLACEMENT_MAX: ${STATIONARY_DISPLACEMENT_MAX:-20.0}
      STATIONARY_FRAMES: ${STATIONARY_FRAMES:-15}
      COUNT_COOLDOWN_SECONDS: ${COUNT_COOLDOWN_SECONDS:-3.0}
      ENABLE_TRACK_STITCHER: ${ENABLE_TRACK_STITCHER:-True}
      STATISTICS_POST_INTERVAL: ${STATISTICS_POST_INTERVAL:-5}
      STATS_LOG_INTERVAL: ${STATS_LOG_INTERVAL:-60}
      TELEGRAM_BASE_URL: ${TELEGRAM_BASE_URL:-}
      TELE_CHAT_ID: ${TELE_CHAT_ID:-}
      SAVE_IMAGE_DIR: /app/images
      ENABLE_SAVE_IMAGE: ${ENABLE_SAVE_IMAGE:-True}
      ENABLE_DRAW_OVERLAY: ${ENABLE_DRAW_OVERLAY:-False}
      IMAGE_STORAGE_MODE: ${IMAGE_STORAGE_MODE:-both}
      SAVE_PERSON_CROP: ${SAVE_PERSON_CROP:-True}
      JPEG_QUALITY: ${JPEG_QUALITY:-75}
      IMAGE_RETENTION_DAYS: ${IMAGE_RETENTION_DAYS:-30}
      NVIDIA_DRIVER_CAPABILITIES: "all"
    volumes:
      - ${SHARED_IMAGE_DIR:-/mnt/data/alarm}:/app/images
      - ${LOG_DIR:-/mnt/logs/people_counting}:/logs
    restart: always
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge
